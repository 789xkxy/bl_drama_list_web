<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧集列表 · 绝对BL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Pacifico&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8fb; --bg-alt:#fcf0f5; --pink:#f3c9db; --blue:#c6e3f1; --lavender:#ddcff2;
    --ink:#3a2a3c; --ink-soft:#7a6579; --accent:#a3406b; --accent-deep:#7c2f52; --gold:#d9a441;
    --card-radius:18px; --shadow-soft:0 10px 30px -14px rgba(122,63,92,0.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Noto Serif SC',serif;margin:0;}
  a{color:inherit;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}

  /* ---------- NAV ---------- */
  .site-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(20px,5vw,56px);background:rgba(255,248,251,0.82);backdrop-filter:blur(10px);border-bottom:1px solid rgba(163,64,107,0.12);}
  .logo{display:flex;align-items:center;gap:8px;}
  .logo-crop{position:relative;height:52px;width:172px;overflow:hidden;flex-shrink:0;}
  .logo-crop .logo-img{position:absolute;top:50%;left:50%;height:230%;width:auto;max-width:none;transform:translate(-50%,-50%);mix-blend-mode:multiply;}
  .logo-fallback{display:flex;align-items:center;gap:8px;}
  .logo .mark{width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--pink),var(--blue),var(--lavender),var(--pink));flex-shrink:0;}
  .logo-cn{font-family:'ZCOOL KuaiLe',cursive;font-size:1.9rem;font-weight:400;letter-spacing:.02em;color:#ff6fa8;text-shadow:2px 2px 0 #ffe3ee;}
  .logo-en{font-family:'Pacifico',cursive;font-size:1.45rem;font-weight:400;letter-spacing:.01em;margin-left:3px;background:linear-gradient(120deg,#ff3399,#9c5fd6);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(1.5px 1.5px 0 #ffe3ee);}
  .nav-links{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-size:.92rem;font-weight:500;color:var(--ink-soft);}
  .nav-links a{position:relative;padding:4px 0;transition:color .2s ease;}
  .nav-links a::after{content:"";position:absolute;left:0;bottom:-2px;width:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--lavender));transition:width .25s ease;}
  .nav-links a:hover{color:var(--accent-deep);}
  .nav-links a:hover::after{width:100%;}
  .nav-links a.active{color:var(--accent-deep);font-weight:700;}
  .nav-links a.active::after{width:100%;}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .nav-search{display:flex;align-items:center;gap:8px;background:var(--bg-alt);border:1px solid rgba(163,64,107,0.18);border-radius:999px;padding:8px 14px;font-size:.85rem;color:var(--ink-soft);}
  .nav-search input{border:none;background:transparent;outline:none;width:140px;font-family:inherit;font-size:.85rem;color:var(--ink);}
  .nav-toggle{display:none;flex-direction:column;gap:4px;background:none;border:none;padding:6px;}
  .nav-toggle span{width:22px;height:2px;background:var(--accent-deep);border-radius:2px;}

  /* ---------- PAGE HEAD ---------- */
  .page-head{padding:34px clamp(16px,4vw,48px) 4px;}
  .page-head h1{font-size:2rem;color:var(--ink);}
  .page-sub{font-size:.85rem;color:var(--ink-soft);margin-top:8px;}

  /* ---------- TOOLBAR ---------- */
  .toolbar{padding:18px clamp(16px,4vw,48px) 6px;display:flex;flex-direction:column;gap:14px;}
  .filter-group{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .filter-label{font-size:.8rem;font-weight:700;color:var(--accent-deep);padding-top:8px;min-width:36px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:8px 18px;border-radius:999px;font-size:.86rem;font-weight:500;border:1px solid rgba(163,64,107,0.22);background:#fff;color:var(--ink-soft);transition:all .2s ease;cursor:pointer;}
  .chip:hover{background:linear-gradient(120deg,var(--pink),var(--lavender));color:var(--accent-deep);border-color:transparent;transform:translateY(-1px);}
  .chip.active{background:linear-gradient(120deg,var(--pink),var(--lavender));color:var(--accent-deep);border-color:transparent;}
  .filter-extra{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .filter-extra label{font-size:.82rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .filter-extra select{padding:7px 12px;border-radius:10px;border:1px solid rgba(163,64,107,0.22);background:#fff;font-family:inherit;font-size:.85rem;color:var(--ink);}
  .reset-btn{padding:7px 14px;border-radius:999px;border:1px solid rgba(163,64,107,0.22);background:#fff;color:var(--accent);font-size:.82rem;cursor:pointer;transition:all .2s;}
  .reset-btn:hover{background:var(--bg-alt);}

  /* ---------- GRID ---------- */
  .grid-wrap{padding:22px clamp(16px,4vw,48px) 10px;}
  .drama-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px;}
  .drama-card{display:block;background:#fff;border-radius:var(--card-radius);overflow:hidden;border:1px solid rgba(163,64,107,0.1);box-shadow:0 8px 22px -16px rgba(58,42,60,0.3);transition:transform .25s ease, box-shadow .25s ease;text-decoration:none;color:inherit;}
  .drama-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);}
  .card-poster{aspect-ratio:3/4;position:relative;overflow:hidden;}
  .card-poster .poster-fallback{position:absolute;inset:0;display:flex;align-items:flex-end;padding:12px;color:#fff;transition:background .8s ease;}
  .card-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card-poster .cp-tag{position:relative;z-index:1;font-size:.72rem;background:rgba(0,0,0,0.36);color:#fff;padding:3px 9px;border-radius:999px;font-weight:600;}
  .card-poster .country-badge{position:absolute;top:10px;right:10px;z-index:1;font-size:.7rem;font-weight:700;color:var(--accent-deep);background:rgba(255,255,255,0.85);padding:3px 9px;border-radius:999px;}
  .card-body{padding:12px 14px 16px;}
  .card-body h3{font-size:.95rem;color:var(--ink);margin-bottom:4px;line-height:1.4;}
  .card-body .meta{font-size:.76rem;color:var(--ink-soft);margin-bottom:8px;}
  .card-body .summary{font-size:.78rem;color:var(--ink-soft);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .empty-state{text-align:center;padding:70px 20px;color:var(--ink-soft);font-size:.95rem;}

  /* ---------- FOOTER ---------- */
  footer{margin-top:56px;padding:38px clamp(16px,4vw,48px) 30px;border-top:1px solid rgba(163,64,107,0.12);display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;color:var(--ink-soft);font-size:.85rem;}
  footer .foot-brand{max-width:340px;}
  footer .foot-brand .display{margin-bottom:8px;}
  footer .foot-links{display:flex;gap:36px;flex-wrap:wrap;}
  footer .foot-links div h4{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:10px;font-family:'Noto Sans SC',sans-serif;}
  footer .foot-links ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  footer .copyright{width:100%;margin-top:20px;padding-top:16px;border-top:1px dashed rgba(163,64,107,0.18);font-size:.76rem;color:var(--ink-soft);opacity:.8;}

  @media (max-width:760px){
    .nav-links{display:none;}
    .nav-search input{width:90px;}
    .nav-toggle{display:flex;}
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="logo">
    <a href="../首页/index9.html" style="display:flex;align-items:center;gap:8px;text-decoration:none;">
      <div class="logo-crop">
        <img class="logo-img" src="https://raw.githubusercontent.com/789xkxy/bl_drama_list_web/d5ad95e39beacf6b2a9148aa9b1f238f89aa1afd/%E7%BD%91%E7%AB%99%E5%88%B6%E4%BD%9C%E4%B8%AD/%E6%A0%87%E9%A2%98.png" alt="绝对BL" onerror="this.closest('.logo-crop').style.display='none'; this.closest('.logo-crop').nextElementSibling.style.display='flex';">
      </div>
      <span class="logo-fallback" style="display:none;"><span class="mark"></span><span class="logo-cn">绝对</span><span class="logo-en">BL</span></span>
    </a>
  </div>
  <ul class="nav-links">
    <li><a href="../首页/index9.html">首页</a></li>
    <li><a href="../列表页/list.html" class="active">剧集列表</a></li>
    <li><a href="#">演员</a></li>
    <li><a href="#">配对</a></li>
    <li><a href="../想看清单/wishlist.html">想看清单</a></li>
    <li><a href="#">剧评区</a></li>
    <li><a href="../排行榜/ranking.html">排行榜</a></li>
  </ul>
  <div class="nav-right">
    <div class="nav-search">🔍<input type="text" id="searchInput" placeholder="搜索剧名 / 演员 / Tag"></div>
    <button class="nav-toggle" aria-label="打开菜单"><span></span><span></span><span></span></button>
  </div>
</nav>

<header class="page-head">
  <h1 class="display">剧集列表</h1>
  <p class="page-sub" id="resultInfo">共 0 部</p>
</header>

<section class="toolbar">
  <div class="filter-group">
    <span class="filter-label">国家</span>
    <div class="chip-row" id="countryChips"></div>
  </div>
  <div class="filter-group">
    <span class="filter-label">标签</span>
    <div class="chip-row" id="tagChips"></div>
  </div>
  <div class="filter-group">
    <span class="filter-label">更多</span>
    <div class="filter-extra">
      <label>年份 <select id="yearSelect"><option value="">全部</option></select></label>
      <label>排序 <select id="sortSelect">
        <option value="latest">最新添加</option>
        <option value="rating">评分最高</option>
        <option value="year">年份最新</option>
        <option value="title">标题</option>
      </select></label>
      <button class="reset-btn" id="resetBtn">重置筛选</button>
    </div>
  </div>
</section>

<div class="grid-wrap">
  <div class="drama-grid" id="dramaGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">没有找到符合条件的剧集～换个关键词或筛选条件试试吧</div>
</div>

<footer>
  <div class="foot-brand">
    <div class="display">绝对BL</div>
    <p>这是我一个人的观剧存档，记录看过的每一部剧、每一对CP、每一次心动瞬间。数据仅保存在本地，不涉及其他用户。</p>
  </div>
  <div class="foot-links">
    <div><h4>浏览</h4><ul><li><a href="../列表页/list.html">剧集列表</a></li><li><a href="#">配对标签</a></li><li><a href="../排行榜/ranking.html">排行榜</a></li></ul></div>
    <div><h4>我的</h4><ul><li><a href="../想看清单/wishlist.html">想看清单</a></li><li><a href="#">剧评区</a></li><li><a href="#">评分记录</a></li></ul></div>
  </div>
  <div class="copyright">© 2026 绝对BL · 个人观剧记录站 · 持续更新中</div>
</footer>

<script src="../../剧集数据/dramas.js"></script>
<script>
(function(){
  const gradients = ['#e79cc0,#a35a89','#8fb9d8,#4f6f96','#b79ce0,#6f4f9c','#f0b3c4,#c9749a','#c9a6dd,#8368a8','#9fd0c7,#4f9488'];
  const dramaAll = (window.DRAMAS || []).map((d, i) => Object.assign({}, d, { raw: toRaw(d.image), grad: gradients[i % gradients.length] }));
  const statusMap = (function(){ try { return JSON.parse(localStorage.getItem('bl_status')) || {}; } catch(e){ return {}; } })();
  /* 想看 = 仅出现在想看清单，列表页隐藏 */
  const dramaData = dramaAll.filter(d => statusMap[d.id] !== '想看');

  function toRaw(url){
    const m = url.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/);
    if(!m) return url;
    return 'https://raw.githubusercontent.com/' + m[1] + '/' + m[2] + '/' + m[3] + '/' + m[4];
  }
  function extractColor(img){
    return new Promise((resolve) => {
      try{
        const c = document.createElement('canvas');
        const w = c.width = 24, h = c.height = 32;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<data.length;i+=4){ r+=data[i]; g+=data[i+1]; b+=data[i+2]; n++; }
        resolve([Math.round(r/n), Math.round(g/n), Math.round(b/n)]);
      }catch(e){ resolve(null); }
    });
  }
  const toward = (rgb, target, amt) => rgb.map((c,i) => Math.round(c + (target[i]-c)*amt));
  const mixWhite = (rgb, amt) => toward(rgb, [255,255,255], amt);
  const mixBlack = (rgb, amt) => toward(rgb, [0,0,0], amt);
  const rgbStr = (rgb, a) => a===undefined ? 'rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')' : 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')';
  const hexToRgb = (hex) => {
    const n = parseInt(hex.replace('#',''), 16);
    return [(n>>16)&255, (n>>8)&255, n&255];
  };
  function buildPosterFallback(rgb){
    const deep = mixBlack(rgb, 0.3);
    const light = mixWhite(rgb, 0.1);
    return 'linear-gradient(170deg, ' + rgbStr(light) + ', ' + rgbStr(deep) + ' 78%)';
  }
  function applyPosterTint(imgEl, slideEl, fallbackEl, seed){
    if(seed){
      if(slideEl) slideEl.style.background = 'linear-gradient(100deg, ' + rgbStr(mixBlack(seed,0.12)) + ' 0%, ' + rgbStr(mixWhite(seed,0.35)) + ' 50%, ' + rgbStr(mixWhite(seed,0.72)) + ' 100%)';
      if(fallbackEl) fallbackEl.style.background = buildPosterFallback(seed);
    }
    if(/^https?:/i.test(imgEl.src)) imgEl.crossOrigin = 'anonymous';
    imgEl.addEventListener('load', () => {
      extractColor(imgEl).then(rgb => {
        if(!rgb) return;
        if(slideEl) slideEl.style.background = 'linear-gradient(100deg, ' + rgbStr(mixBlack(rgb,0.12)) + ' 0%, ' + rgbStr(mixWhite(rgb,0.35)) + ' 50%, ' + rgbStr(mixWhite(rgb,0.72)) + ' 100%)';
        if(fallbackEl) fallbackEl.style.background = buildPosterFallback(rgb);
      });
    });
    imgEl.addEventListener('error', () => { imgEl.remove(); });
  }

  /* ---- state ---- */
  const params = new URLSearchParams(location.search);
  const state = {
    q: params.get('q') || '',
    country: params.get('country') || '',
    tag: params.get('tag') || '',
    year: params.get('year') || '',
    sort: params.get('sort') || 'latest'
  };

  const countries = [...new Set(dramaData.map(d => d.country))].sort((a,b) => a.localeCompare(b, 'zh'));
  const tags = [...new Set(dramaData.flatMap(d => d.tags || []))].sort((a,b) => a.localeCompare(b, 'zh'));
  const years = [...new Set(dramaData.map(d => d.year))].sort((a,b) => b - a);

  function loadRatings(){
    try { return JSON.parse(localStorage.getItem('bl_ratings')) || {}; } catch(e){ return {}; }
  }
  function scoreOf(d, ratings){
    const r = ratings[d.id];
    if(!r) return -1;
    const vals = Object.values(r).map(Number).filter(v => !isNaN(v));
    if(!vals.length) return -1;
    return vals.reduce((s,v) => s+v, 0) / vals.length;
  }

  function filtered(){
    let list = dramaData.filter(d => {
      if(state.q){
        const q = state.q.toLowerCase();
        const hay = [d.title, d.cp, d.country, String(d.year), ...(d.actors||[]), ...(d.tags||[]), ...(d.directors||[])].join(' ').toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(state.country && d.country !== state.country) return false;
      if(state.tag && !(d.tags||[]).includes(state.tag)) return false;
      if(state.year && String(d.year) !== state.year) return false;
      return true;
    });
    const ratings = loadRatings();
    switch(state.sort){
      case 'rating': list = list.slice().sort((a,b) => (scoreOf(b,ratings) - scoreOf(a,ratings)) || (b.year - a.year)); break;
      case 'year': list = list.slice().sort((a,b) => b.year - a.year); break;
      case 'title': list = list.slice().sort((a,b) => a.title.localeCompare(b.title, 'zh')); break;
      default: list = list.slice().sort((a,b) => Number(b.id) - Number(a.id));
    }
    return list;
  }

  function renderChips(){
    const countryWrap = document.getElementById('countryChips');
    countryWrap.innerHTML = '';
    const allC = document.createElement('button');
    allC.className = 'chip' + (state.country === '' ? ' active' : '');
    allC.textContent = '全部国家';
    allC.addEventListener('click', () => { state.country = ''; sync(); });
    countryWrap.appendChild(allC);
    countries.forEach(ct => {
      const b = document.createElement('button');
      b.className = 'chip' + (state.country === ct ? ' active' : '');
      b.textContent = ct;
      b.addEventListener('click', () => { state.country = ct; sync(); });
      countryWrap.appendChild(b);
    });

    const tagWrap = document.getElementById('tagChips');
    tagWrap.innerHTML = '';
    const allT = document.createElement('button');
    allT.className = 'chip' + (state.tag === '' ? ' active' : '');
    allT.textContent = '全部标签';
    allT.addEventListener('click', () => { state.tag = ''; sync(); });
    tagWrap.appendChild(allT);
    tags.forEach(t => {
      const b = document.createElement('button');
      b.className = 'chip' + (state.tag === t ? ' active' : '');
      b.textContent = '#' + t;
      b.addEventListener('click', () => { state.tag = t; sync(); });
      tagWrap.appendChild(b);
    });

    const yearSel = document.getElementById('yearSelect');
    yearSel.innerHTML = '<option value="">全部</option>';
    years.forEach(y => {
      const o = document.createElement('option');
      o.value = String(y);
      o.textContent = String(y) + ' 年';
      if(state.year === String(y)) o.selected = true;
      yearSel.appendChild(o);
    });
    document.getElementById('sortSelect').value = state.sort;
  }

  function render(){
    const list = filtered();
    document.getElementById('resultInfo').textContent = '共 ' + list.length + ' 部剧集' + (state.q ? '（关键词：' + state.q + '）' : '');
    const grid = document.getElementById('dramaGrid');
    grid.innerHTML = '';
    list.forEach(d => {
      const baseCol = d.color ? hexToRgb(d.color) : d.grad.split(',').map(hexToRgb)[0];
      const card = document.createElement('a');
      card.className = 'drama-card';
      card.href = '../详情页/drama.html?id=' + d.id;
      card.innerHTML = `
        <div class="card-poster">
          <div class="poster-fallback" style="background:${buildPosterFallback(baseCol)};">
            <span class="cp-tag">${d.cp}</span>
          </div>
          <span class="country-badge">${d.country}</span>
          <img src="${d.raw}" alt="${d.title}" loading="lazy">
        </div>
        <div class="card-body">
          <h3>${d.title}</h3>
          <div class="meta">${d.country} · ${d.year}</div>
          <div class="summary">${d.summary}</div>
        </div>`;
      grid.appendChild(card);
      applyPosterTint(card.querySelector('img'), null, card.querySelector('.poster-fallback'), baseCol);
    });
    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
  }

  function sync(){
    renderChips();
    render();
    const qs = new URLSearchParams();
    if(state.q) qs.set('q', state.q);
    if(state.country) qs.set('country', state.country);
    if(state.tag) qs.set('tag', state.tag);
    if(state.year) qs.set('year', state.year);
    if(state.sort && state.sort !== 'latest') qs.set('sort', state.sort);
    const str = qs.toString();
    history.replaceState(null, '', str ? '?' + str : location.pathname);
  }

  /* ---- events ---- */
  const searchInput = document.getElementById('searchInput');
  searchInput.value = state.q;
  let debounce;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => { state.q = searchInput.value.trim(); sync(); }, 250);
  });
  document.getElementById('yearSelect').addEventListener('change', (e) => { state.year = e.target.value; sync(); });
  document.getElementById('sortSelect').addEventListener('change', (e) => { state.sort = e.target.value; sync(); });
  document.getElementById('resetBtn').addEventListener('click', () => {
    state.q = ''; state.country = ''; state.tag = ''; state.year = ''; state.sort = 'latest';
    searchInput.value = '';
    sync();
  });

  /* ---- mobile nav ---- */
  const toggle = document.querySelector('.nav-toggle');
  const links = document.querySelector('.nav-links');
  toggle.addEventListener('click', () => {
    const open = links.style.display === 'flex';
    links.style.display = open ? 'none' : 'flex';
    links.style.flexDirection = 'column';
    links.style.position = 'absolute';
    links.style.top = '58px';
    links.style.right = '20px';
    links.style.background = '#fff';
    links.style.padding = '16px 22px';
    links.style.borderRadius = '14px';
    links.style.boxShadow = '0 12px 30px -12px rgba(58,42,60,0.35)';
  });

  renderChips();
  render();
})();
</script>
</body>
</html>
